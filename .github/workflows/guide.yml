name: guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Parts 1-3 on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A user called dev with sudo, and a copy of this repository in its home
        run: |
          sudo hostnamectl set-hostname devbox
          sudo useradd -m -s /bin/bash dev
          echo 'dev ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/dev >/dev/null
          sudo usermod -aG docker dev
          sudo cp -r "$GITHUB_WORKSPACE" /home/dev/security-principles-demo
          sudo chown -R dev:dev /home/dev/security-principles-demo
          sudo install -d -m 1777 /tmp/cap
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          sudo apt-get update -q
      - name: Part 1
        run: sudo -u dev env -i HOME=/home/dev USER=dev LOGNAME=dev SHELL=/bin/bash PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 TERM=dumb CAP_DIR=/tmp/cap GITHUB_RUN_ID="$GITHUB_RUN_ID" bash /home/dev/security-principles-demo/scripts/p1-linux.sh
      - name: Part 2
        if: success() || failure()
        run: sudo -u dev env -i HOME=/home/dev USER=dev LOGNAME=dev SHELL=/bin/bash PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 TERM=dumb CAP_DIR=/tmp/cap GITHUB_RUN_ID="$GITHUB_RUN_ID" bash /home/dev/security-principles-demo/scripts/p2-linux.sh
      - name: Part 3
        if: success() || failure()
        run: sudo -u dev env -i HOME=/home/dev USER=dev LOGNAME=dev SHELL=/bin/bash PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 TERM=dumb CAP_DIR=/tmp/cap GITHUB_RUN_ID="$GITHUB_RUN_ID" bash /home/dev/security-principles-demo/scripts/p3-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: captures-linux
          path: /tmp/cap/

  kubernetes:
    name: Parts 1-4 on kind
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.1
      CAP_DIR: /tmp/cap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kind and kubectl (checksums verified), copy the repository to ~/security-principles-demo
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          sudo install -m 0755 kind kubectl /usr/local/bin/
          rm kind kubectl kind.sha256 kubectl.sha256
          cp -r "$GITHUB_WORKSPACE" ~/security-principles-demo
          mkdir -p "$CAP_DIR"
      - name: Part 1
        run: bash ~/security-principles-demo/scripts/p1-k8s.sh
      - name: Part 2
        if: success() || failure()
        run: bash ~/security-principles-demo/scripts/p2-k8s.sh
      - name: Part 3
        if: success() || failure()
        run: bash ~/security-principles-demo/scripts/p3-k8s.sh
      - name: Part 4
        if: success() || failure()
        run: bash ~/security-principles-demo/scripts/p4-k8s.sh
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n shop get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n istio-system logs -l app=ztunnel --since=30m --max-log-requests=8 | grep -E 'error|warn' | tail -40 || true
          kubectl -n istio-system logs -l app=ztunnel --since=30m --max-log-requests=8 --timestamps | grep -E 'worker|postgres-' | grep -v 'src.workload="api' | tail -40 || true
          ~/istio-1.31.3/bin/istioctl ztunnel-config workloads --workload-namespace shop || true
          kubectl -n shop get pods -o wide || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: captures-kubernetes
          path: /tmp/cap/

  oidc:
    name: Part 4, OIDC token claims
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CAP_DIR: /tmp/cap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/p4-oidc.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: captures-oidc
          path: /tmp/cap/

  checks:
    name: Syntax checks (aws CLI, Terraform, actionlint, JSON)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      TERRAFORM_VERSION: 1.17.0
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every aws command in the guide, without credentials
        run: |
          aws --version
          bash scripts/check-cli.sh
      - name: terraform fmt and validate
        run: |
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          curl -fsSLO "$base/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " terraform_${TERRAFORM_VERSION}_linux_amd64.zip" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" terraform && sudo install -m 0755 terraform /usr/local/bin/
          cd part02/terraform
          terraform fmt -check -diff
          terraform init -backend=false -input=false -no-color >/dev/null
          terraform validate -no-color
      - name: actionlint on the example deploy workflow
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          # actionlint 1.7.12 predates the ubuntu-26.04 runner label
          ./actionlint -ignore 'label "ubuntu-26.04" is unknown' part04/deploy-example.yml .github/workflows/guide.yml
          echo "actionlint: no findings"
      - name: JSON files parse
        run: for f in part03/iam/*.json part04/trust-policy.json; do python3 -m json.tool "$f" >/dev/null; echo "ok $f"; done
