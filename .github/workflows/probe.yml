name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Versions
        run: |
          set -x
          cat /etc/os-release | head -3
          uname -r
          ssh -V || true
          dpkg -l | grep -E 'openssh|nginx|postgres|aide|nftables|unattended|python3 |git |curl |docker|jq ' | awk '{print $2, $3}' || true
          apt-cache policy openssh-server aide nginx postgresql postgresql-18 nftables unattended-upgrades python3-psycopg | grep -E '^[a-z]|Candidate|Installed'
          python3 --version; git --version; curl --version | head -1; systemctl --version | head -1
          docker version --format '{{.Server.Version}}' || true
          which aws terraform kind kubectl gitleaks actionlint jq || true
          aws --version || true
          id; ls -ld /home/runner; hostname
          systemctl is-enabled apt-daily.timer unattended-upgrades 2>&1 || true
          cat /etc/ssh/sshd_config 2>/dev/null | grep -n -i include || true
          ls /etc/ssh/sshd_config.d/ 2>/dev/null || true
          systemctl list-unit-files 'ssh*' 2>/dev/null || true
          update-alternatives --display iptables 2>/dev/null | head -3 || true
          df -h / | tail -1; nproc; free -g | head -2
